<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="no-referrer">
    <title>Raja Pantun - Game Edukasi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a202c;
            font-family: 'Fredoka One', cursive;
            touch-action: none; /* Mencegah scroll pada layar sentuh */
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            /* Background Awal Menu */
            background-image: url('https://github.com/user-attachments/assets/b7909539-0d15-4536-8a7a-286c487d5fee');
            transition: background-image 0.2s ease-in-out;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .interactive {
            pointer-events: auto;
        }

        .hidden {
            display: none !important;
        }

        .title-shadow {
            text-shadow: 0 4px 10px rgba(0,0,0,0.5), 0 0 20px rgba(236, 72, 153, 0.6);
        }

        /* Animasi Countdown */
        @keyframes countdownBounce {
            0%, 100% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.2); opacity: 1; }
        }
        .countdown-text {
            animation: countdownBounce 1s infinite;
            font-size: 8rem;
            color: #fff;
            text-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <!-- Toggle Mute Button -->
    <button id="muteBtn" class="absolute top-4 left-4 z-[100] text-white text-3xl bg-black/40 w-14 h-14 flex items-center justify-center rounded-full backdrop-blur-sm shadow-lg transition transform hover:scale-110 active:scale-95 cursor-pointer">
        🔊
    </button>

    <!-- Canvas Utama (Menu dan Game dirender di sini) -->
    <canvas id="gameCanvas"></canvas>

    <!-- Modal Level Terkunci -->
    <div id="lockedModal" class="ui-layer z-[70] hidden bg-black/80">
        <div class="bg-gray-800 border-4 border-red-500 rounded-2xl p-8 max-w-[90%] md:max-w-md text-center shadow-2xl interactive">
            <h3 class="text-4xl text-red-500 mb-4 title-shadow">Terkunci!</h3>
            <p id="lockedModalText" class="text-white text-xl font-['Nunito'] mb-6">
                Dapatkan skor minimal <span class="text-yellow-400 font-bold text-2xl">200</span> di Level Mudah untuk membuka level ini.
            </p>
            <button onclick="document.getElementById('lockedModal').classList.add('hidden')" class="bg-blue-500 hover:bg-blue-600 text-white text-xl py-3 px-8 rounded-xl font-bold font-['Nunito'] w-full transition transform hover:scale-105 active:scale-95">
                Oke, Mengerti!
            </button>
        </div>
    </div>

    <!-- Countdown Overlay -->
    <div id="countdownOverlay" class="ui-layer hidden z-[60] bg-black/20">
        <div id="countdownText" class="countdown-text">3</div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen" class="ui-layer interactive z-50 hidden" style="background-image: url('https://github.com/user-attachments/assets/b7909539-0d15-4536-8a7a-286c487d5fee'); background-size: 100% 100%; background-repeat: no-repeat; background-position: center; background-color: rgba(0,0,0,0.8); background-blend-mode: overlay;">
        <h2 id="gameOverTitle" class="text-6xl md:text-7xl text-white mb-6 title-shadow text-center">GAME OVER</h2>
        <p id="gameOverScore" class="text-3xl text-yellow-400 mb-8 font-['Nunito'] text-center">Skor: 0</p>
        
        <button onclick="backToMenu()" class="text-white text-2xl py-4 px-10 rounded-2xl transition transform hover:scale-105 active:scale-95" style="background-image: url('https://private-user-images.githubusercontent.com/217060870/583846776-468cf861-e122-49dd-829b-001add7d8296.png?jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmF3LmdpdGh1YnVzZXJjb250ZW50LmNvbSIsImtleSI6ImtleTUiLCJleHAiOjE3NzcxODg3NDksIm5iZiI6MTc3NzE4ODQ0OSwicGF0aCI6Ii8yMTcwNjA4NzAvNTgzODQ2Nzc2LTQ2OGNmODYxLWUxMjItNDlkZC04MjliLTAwMWFkZDdkODI5Ni5wbmc_WC1BbXotQWxnb3JpdGhtPUFXUzQtSE1BQy1TSEEyNTYmWC1BbXotQ3JlZGVudGlhbD1BS0lBVkNPRFlMU0E1M1BRSzRaQSUyRjIwMjYwNDI2JTJGdXMtZWFzdC0xJTJGczMlMkZhd3M0X3JlcXVlc3QmWC1BbXotRGF0ZT0yMDI2MDQyNlQwNzI3MjlaJlgtQW16LUV4cGlyZXM9MzAwJlgtQW16LVNpZ25hdHVyZT00YzdlY2I4YjZkMDY1MjcyYTY0ZWI3MTkxYjdkZjQ5NjY5YjVkNzRmOWEzZmVjYzhkNGY4MDgwOWI0OWM4MmI0JlgtQW16LVNpZ25lZEhlYWRlcnM9aG9zdCZyZXNwb25zZS1jb250ZW50LXR5cGU9aW1hZ2UlMkZwbmcifQ.5tzzR7grlRSS51w5p1Sd848BFC0XIheGisXTDAhfr24'); background-size: 100% 100%; background-repeat: no-repeat; background-color: transparent; border: none;">
            Kembali ke Menu
        </button>
    </div>

<script>
    // --- AUDIO SETUP ---
    const swordSound = new Audio('https://github.com/user-attachments/files/27097721/espada-som.mp3');
    const bgMusic = new Audio('https://github.com/user-attachments/files/27098976/0011.Happy.Ukulele.Whistle.-.AndruLeo.Music.mp3');
    bgMusic.loop = true;
    bgMusic.volume = 0.4; // Volume disesuaikan agar tidak menutupi suara pedang
    let isMusicPlaying = false;

    // --- DATA EDUKASI (RIMA PANTUN UNTUK LEVEL MUDAH & SEDANG) ---
    const RHYME_DATA = [
        { target: "Batu", correct: ["Satu", "Ratu", "Pintu", "Sepatu", "Waktu", "Tentu"], wrong: ["Buku", "Lari", "Makan", "Meja", "Gitar", "Lampu"] },
        { target: "Makan", correct: ["Ikan", "Jalan", "Kawan", "Taman", "Pesan", "Hujan"], wrong: ["Tidur", "Minum", "Baju", "Sepeda", "Kucing", "Pohon"] },
        { target: "Lari", correct: ["Tari", "Cari", "Jari", "Pagi", "Mari", "Besi"], wrong: ["Lompat", "Jauh", "Batu", "Rumah", "Awan", "Langit"] },
        { target: "Sayang", correct: ["Bayang", "Layang", "Mayang", "Wayang", "Goyang", "Pejuang"], wrong: ["Cinta", "Benci", "Sedih", "Marah", "Tawa", "Senyum"] },
        { target: "Buku", correct: ["Saku", "Paku", "Kuku", "Bangku", "Suku", "Kaku"], wrong: ["Pensil", "Kertas", "Tas", "Papan", "Kelas", "Guru"] },
        { target: "Bintang", correct: ["Lintang", "Kentang", "Pantang", "Hutang", "Petang", "Kandang"], wrong: ["Bulan", "Surya", "Bumi", "Planet", "Meteor", "Awan"] },
        { target: "Kaca", correct: ["Baca", "Caca", "Maca", "Cuaca", "Lencana", "Bencana"], wrong: ["Batu", "Kayu", "Besi", "Plastik", "Kain", "Kertas"] },
        { target: "Gitar", correct: ["Pintar", "Bentar", "Lontar", "Getar", "Pudar", "Kekar"], wrong: ["Piano", "Drum", "Suling", "Biola", "Musik", "Lagu"] }
    ];

    // --- DATA EDUKASI (SUSUN PANTUN UNTUK LEVEL SULIT) ---
    const PANTUN_DATA = [
        { theme: "Teka-teki", lines: ["Kalau tuan bawa keladi", "Bawakan juga si pucuk rebung", "Kalau tuan bijak bestari", "Binatang apa tanduk di hidung?"] },
        { theme: "Jenaka", lines: ["Pohon manggis di tepi rawa", "Tempat kakek tidur beradu", "Sedang menangis nenek tertawa", "Melihat kakek bermain gundu"] },
        { theme: "Nasihat", lines: ["Beli durian di pasar induk", "Rasanya manis dan juga legit", "Ilmu padi makin merunduk", "Jangan sombong sundul ke langit"] },
        { theme: "Agama", lines: ["Banyak bulan perkara bulan", "Tidak semulia bulan puasa", "Banyak tuhan perkara tuhan", "Tidak semulia Tuhan Yang Esa"] }
    ];

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // --- MUTE BUTTON LOGIC ---
    const muteBtn = document.getElementById('muteBtn');
    muteBtn.addEventListener('click', (e) => {
        if (bgMusic.muted) {
            bgMusic.muted = false;
            muteBtn.innerText = "🔊";
            if (!isMusicPlaying) {
                bgMusic.play().catch(err => console.log(err));
                isMusicPlaying = true;
            }
        } else {
            bgMusic.muted = true;
            muteBtn.innerText = "🔇";
        }
    });

    // Menangani aturan Autoplay Browser (Memutar musik pada interaksi pertama)
    const startAudio = () => {
        if (!isMusicPlaying && !bgMusic.muted) {
            bgMusic.play().then(() => {
                isMusicPlaying = true;
            }).catch(err => console.log("Autoplay dicegah browser:", err));
        }
    };
    window.addEventListener('click', startAudio, { once: true });
    window.addEventListener('touchstart', startAudio, { once: true });

    let width, height;
    let gameState = 'menu'; // menu, countdown, playing, gameover
    let gameMode = 'single';
    
    // Variabel Global Level Mudah & Sedang
    let lastTime = 0;
    let spawnTimer = 0;
    let spawnInterval = 2500; 
    let difficultyMultiplier = 0.7; 

    let menuButtons = []; 
    let fruits = [];
    let bombs = []; 
    let particles = [];
    let popups = [];
    let swipes = {};

    const p1 = { xMin: 0, xMax: 0, score: 0, lives: 3, streak: 0, targetWord: "", currentData: null, color: '#3b82f6' };

    // Simpan high score
    let highScoreEasy = parseInt(localStorage.getItem('rajaPantunHighScoreEasy')) || 0;
    let highScoreMedium = parseInt(localStorage.getItem('rajaPantunHighScoreMedium')) || 0;
    let highScoreHard = parseInt(localStorage.getItem('rajaPantunHighScoreHard')) || 0;

    const FRUIT_COLORS = [
        ['#ff4b2b', '#ff416c'],
        ['#fceabb', '#f8b500'],
        ['#56ab2f', '#a8e063'],
        ['#8E2DE2', '#4A00E0'],
    ];

    // Variabel Global Level Sulit (Drag & Drop)
    let currentPantunIndex = 0;
    let hardModeTimer = 60;
    let lastTimerUpdate = 0;
    let slots = [];
    let draggables = [];
    let draggingItem = null;
    let dragOffsetX = 0;
    let dragOffsetY = 0;

    // --- KELAS TOMBOL MENU (BISA DIPOTONG) ---
    class MenuButton {
        constructor(x, y, w, h, imgSrc, mode) {
            this.x = x; 
            this.y = y; 
            this.w = w; 
            this.h = h;
            this.mode = mode;
            this.sliced = false;
            this.halves = [];
            
            this.img = new Image();
            this.img.src = imgSrc;
        }

        draw() {
            if (!this.img.complete) return; 

            if (this.sliced) {
                this.halves.forEach(h => {
                    h.x += h.vx; 
                    h.y += h.vy; 
                    h.vy += 0.4; 
                    h.rotation += h.vRot;
                    
                    ctx.save();
                    ctx.translate(h.x, h.y);
                    ctx.rotate(h.rotation);
                    
                    ctx.beginPath();
                    if (h.isLeft) {
                        ctx.rect(-this.w/2, -this.h/2, this.w/2, this.h);
                    } else {
                        ctx.rect(0, -this.h/2, this.w/2, this.h);
                    }
                    ctx.clip();
                    ctx.drawImage(this.img, -this.w/2, -this.h/2, this.w, this.h);
                    
                    ctx.beginPath();
                    ctx.moveTo(0, -this.h/2);
                    ctx.lineTo(0, this.h/2);
                    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.restore();
                });
            } else {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                let floatY = Math.sin(Date.now() / 400 + this.x) * 10;
                
                ctx.shadowColor = 'rgba(0,0,0,0.5)';
                ctx.shadowBlur = 15;
                ctx.shadowOffsetY = 10;
                
                ctx.drawImage(this.img, -this.w/2, -this.h/2 + floatY, this.w, this.h);

                // --- INDIKATOR TOMBOL TERKUNCI ---
                let isLocked = false;
                if (this.mode === 'medium' && highScoreEasy < 200) isLocked = true;
                if (this.mode === 'hard' && highScoreMedium < 200) isLocked = true;

                if (isLocked) {
                    ctx.shadowColor = 'black';
                    ctx.shadowBlur = 10;
                    ctx.shadowOffsetY = 2;
                    
                    ctx.fillStyle = 'white';
                    ctx.font = `bold ${this.w/5}px Nunito`;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText("🔒", 0, floatY);
                    
                    ctx.shadowBlur = 0;
                    ctx.shadowOffsetY = 0;
                }

                ctx.restore();
            }
        }

        slice() {
            if (this.sliced) return;

            if (this.mode === 'medium' && highScoreEasy < 200) {
                document.getElementById('lockedModalText').innerHTML = `Dapatkan skor minimal <span class="text-yellow-400 font-bold text-2xl">200</span> di Level Mudah untuk membuka level ini.`;
                document.getElementById('lockedModal').classList.remove('hidden');
                swipes = {}; 
                return;
            }
            if (this.mode === 'hard' && highScoreMedium < 200) {
                document.getElementById('lockedModalText').innerHTML = `Dapatkan skor minimal <span class="text-yellow-400 font-bold text-2xl">200</span> di Level Sedang untuk membuka level ini.`;
                document.getElementById('lockedModal').classList.remove('hidden');
                swipes = {};
                return;
            }

            this.sliced = true;
            menuButtons = menuButtons.filter(btn => btn === this);
            swordSound.currentTime = 0;
            swordSound.play().catch(() => {});

            this.halves = [
                { x: this.x, y: this.y, vx: -3, vy: -5, vRot: -0.05, isLeft: true, rotation: 0 },
                { x: this.x, y: this.y, vx: 3, vy: -5, vRot: 0.05, isLeft: false, rotation: 0 }
            ];
            
            for(let i=0; i<15; i++) particles.push(new Particle(this.x, this.y, '#ffffff'));

            handleStart(this.mode);
        }
    }

    // --- INISIALISASI MENU ---
    function initMenu() {
        menuButtons = [];
        let btnWidth = width < 768 ? 90 : 160;
        let btnHeight = width < 768 ? 120 : 200;
        let gap = width < 768 ? 15 : 40;
        
        let easyX = width / 2 - btnWidth - gap;
        let mediumX = width / 2;
        let hardX = width / 2 + btnWidth + gap;
        let yPos = height * 0.45;

        menuButtons.push(new MenuButton(easyX, yPos, btnWidth, btnHeight, 'https://github.com/user-attachments/assets/468cf861-e122-49dd-829b-001add7d8296', 'single'));
        menuButtons.push(new MenuButton(mediumX, yPos, btnWidth, btnHeight, 'https://github.com/user-attachments/assets/fda6f28b-aab0-4a2f-973d-95c8c1720b2d', 'medium'));
        menuButtons.push(new MenuButton(hardX, yPos, btnWidth, btnHeight, 'https://github.com/user-attachments/assets/cfc0021a-b64b-4db8-90fe-a58885c9a3d6', 'hard'));
    }

    // --- LOGIC COUNTDOWN & START ---
    function handleStart(mode) {
        gameState = 'countdown';
        gameMode = mode;
        
        const gameBg = "url('https://github.com/user-attachments/assets/9e4fb73f-d137-4182-9e3d-a7f18684372d')";
        canvas.style.backgroundImage = gameBg;
        
        setTimeout(() => {
            const countdownOverlay = document.getElementById('countdownOverlay');
            const countdownText = document.getElementById('countdownText');
            countdownOverlay.classList.remove('hidden');
            
            let counter = 3;
            countdownText.innerText = counter;

            const interval = setInterval(() => {
                counter--;
                if (counter > 0) {
                    countdownText.innerText = counter;
                } else if (counter === 0) {
                    countdownText.innerText = "GO!";
                } else {
                    clearInterval(interval);
                    countdownOverlay.classList.add('hidden');
                    startGame();
                }
            }, 1000);
        }, 500);
    }

    function startGame() {
        gameState = 'playing';
        p1.score = 0; 
        p1.lives = 3;
        p1.streak = 0;
        
        if (gameMode === 'hard') {
            currentPantunIndex = 0;
            initHardModeLevel();
        } else {
            pickNewTarget(p1);
            fruits = [];
            bombs = [];
            particles = [];
            popups = [];
            swipes = {};
            spawnTimer = 0;
            
            if (gameMode === 'medium') {
                spawnInterval = 2000; 
                difficultyMultiplier = 1.0; 
            } else {
                spawnInterval = 2500; 
                difficultyMultiplier = 0.7; 
            }
        }
        lastTime = performance.now();
    }

    // --- LOGIC LEVEL SULIT (DRAG AND DROP) ---
    function initHardModeLevel() {
        slots = [];
        draggables = [];
        draggingItem = null;
        
        if(currentPantunIndex >= PANTUN_DATA.length) {
            gameOver(); // Menang
            return;
        }

        let currentPantun = PANTUN_DATA[currentPantunIndex];
        
        // Acak urutan kalimat
        let shuffledLines = currentPantun.lines.map((text, idx) => ({text, id: idx}))
            .sort(() => Math.random() - 0.5);

        let boxW = width * 0.9;
        if(width > 768) boxW = width * 0.5;
        let boxH = height * 0.08;
        let startX = width / 2;

        // Slot Kosong (Di atas)
        let slotStartY = height * 0.15;
        for(let i=0; i<4; i++) {
            slots.push({
                x: startX,
                y: slotStartY + i * (boxH + 15),
                w: boxW,
                h: boxH,
                expectedId: i,
                currentItem: null
            });
        }

        // Pilihan Jawaban (Di bawah)
        let dragStartY = height * 0.6;
        for(let i=0; i<4; i++) {
            draggables.push({
                x: startX,
                y: dragStartY + i * (boxH + 15),
                originX: startX,
                originY: dragStartY + i * (boxH + 15),
                w: boxW,
                h: boxH,
                text: shuffledLines[i].text,
                id: shuffledLines[i].id,
                isDragging: false
            });
        }
        
        hardModeTimer = 60; // Set timer 60 detik
    }

    function drawHardMode(timestamp) {
        // Update Timer
        if (timestamp - lastTimerUpdate > 1000) {
            hardModeTimer--;
            lastTimerUpdate = timestamp;
            if (hardModeTimer <= 0) {
                p1.lives--;
                createPopup("WAKTU HABIS!", width/2, height/2, '#ef4444');
                if (p1.lives <= 0) {
                    gameOver();
                } else {
                    // Nyawa berkurang, tapi bisa mengulang level ini
                    setTimeout(() => { initHardModeLevel(); }, 1000);
                }
            }
        }

        let currentPantun = PANTUN_DATA[currentPantunIndex];
        
        // Header Teks
        ctx.fillStyle = 'white'; 
        ctx.textAlign = 'center'; 
        ctx.textBaseline = 'middle';
        
        let headerSize = width < 768 ? 20 : 30;
        ctx.font = `bold ${headerSize}px Nunito`;
        ctx.fillText(`Tema: ${currentPantun.theme}`, width/2, 30);
        
        ctx.fillStyle = hardModeTimer <= 10 ? '#ef4444' : '#fceabb';
        ctx.font = `bold ${headerSize * 1.5}px Fredoka One`;
        ctx.fillText(`Waktu: ${hardModeTimer}s`, width/2, 30 + headerSize + 10);
        
        // Lives & Score
        ctx.fillStyle = 'white'; 
        ctx.font = `bold ${headerSize}px Nunito`;
        ctx.textAlign = 'left'; 
        ctx.fillText(`Skor: ${p1.score}`, 20, 20);
        ctx.fillStyle = '#ef4444';
        for(let i=0; i<3; i++) ctx.fillText(i < p1.lives ? "❤️" : "🖤", 20 + (i * 35), 50);

        // Gambar Slots
        slots.forEach(s => {
            ctx.beginPath();
            ctx.roundRect(s.x - s.w/2, s.y - s.h/2, s.w, s.h, 10);
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 3;
            ctx.setLineDash([10, 10]);
            ctx.stroke();
            ctx.setLineDash([]); // reset
            
            if (!s.currentItem) {
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                ctx.fill();
            }
        });

        // Gambar Draggables (Mulai dari yang tidak di-drag dulu, baru yang di-drag)
        let nonDragging = draggables.filter(d => !d.isDragging);
        let dragging = draggables.filter(d => d.isDragging);

        [...nonDragging, ...dragging].forEach(d => {
            ctx.beginPath();
            ctx.roundRect(d.x - d.w/2, d.y - d.h/2, d.w, d.h, 10);
            
            let grad = ctx.createLinearGradient(d.x, d.y - d.h/2, d.x, d.y + d.h/2);
            if (d.isDragging) {
                grad.addColorStop(0, '#f59e0b'); // Amber
                grad.addColorStop(1, '#b45309');
            } else {
                grad.addColorStop(0, '#3b82f6'); // Blue
                grad.addColorStop(1, '#1d4ed8');
            }
            
            ctx.fillStyle = grad;
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Teks pada kotak
            ctx.fillStyle = 'white';
            ctx.font = `bold ${Math.min(d.h * 0.4, 20)}px Nunito`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(d.text, d.x, d.y, d.w - 20);
        });

        // Gambar Popups
        for (let i = popups.length - 1; i >= 0; i--) {
            let p = popups[i];
            p.y += p.vy; p.life -= 0.015;
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color; ctx.font = 'bold 30px Fredoka One';
            ctx.textAlign = 'center'; ctx.fillText(p.text, p.x, p.y);
            if (p.life <= 0) popups.splice(i, 1);
        }
        ctx.globalAlpha = 1.0;
    }

    function checkHardModeWin() {
        let isComplete = slots.every(s => s.currentItem !== null);
        if (!isComplete) return;

        let isCorrect = slots.every(s => s.currentItem.id === s.expectedId);
        
        if (isCorrect) {
            p1.score += 200; // Skor besar untuk hard mode
            createPopup("BENAR SEKALI!", width/2, height/2, '#10b981');
            currentPantunIndex++;
            setTimeout(() => {
                if (currentPantunIndex >= PANTUN_DATA.length) {
                    gameOver(); // Menang
                } else {
                    initHardModeLevel();
                }
            }, 1500);
        } else {
            createPopup("SUSUNAN SALAH!", width/2, height/2, '#ef4444');
            // Kembalikan kotak ke posisi semula
            setTimeout(() => {
                slots.forEach(s => {
                    if (s.currentItem) {
                        s.currentItem.x = s.currentItem.originX;
                        s.currentItem.y = s.currentItem.originY;
                        s.currentItem = null;
                    }
                });
            }, 1000);
        }
    }


    // --- ENTITAS BUAH & BOM (Level Mudah/Sedang) ---
    class Fruit {
        constructor(playerObj) {
            this.player = playerObj;
            this.isCorrect = Math.random() > 0.4; 
            const wordList = this.isCorrect ? this.player.currentData.correct : this.player.currentData.wrong;
            this.word = wordList[Math.floor(Math.random() * wordList.length)];
            
            this.radius = window.innerWidth < 768 ? 35 : 45;
            this.x = this.player.xMin + this.radius + Math.random() * (this.player.xMax - this.player.xMin - this.radius*2);
            this.y = height + this.radius;
            
            const centerX = (this.player.xMin + this.player.xMax) / 2;
            this.vx = (centerX - this.x) * 0.01 + (Math.random() - 0.5) * 1.5;
            this.vy = -(height * 0.012) - Math.random() * (height * 0.002) * difficultyMultiplier;
            this.gravity = height * 0.00018;
            
            this.rotation = 0;
            this.vRot = (Math.random() - 0.5) * 0.06;
            this.sliced = false;
            this.halves = [];
            
            const colorPair = FRUIT_COLORS[Math.floor(Math.random() * FRUIT_COLORS.length)];
            this.color1 = colorPair[0];
            this.color2 = colorPair[1];
        }

        update() {
            if (this.sliced) {
                this.halves.forEach(h => {
                    h.x += h.vx; h.y += h.vy;
                    h.vy += this.gravity; h.rotation += h.vRot;
                });
                return;
            }
            this.x += this.vx; this.y += this.vy;
            this.vy += this.gravity; this.rotation += this.vRot;

            if (this.y > height + this.radius * 2 && this.vy > 0) {
                if (this.isCorrect && !this.sliced) {
                    this.player.lives--;
                    this.player.streak = 0; 
                    createPopup("MISS!", this.x, height - 50, '#ef4444');
                    checkGameOver();
                }
                this.toBeRemoved = true;
            }
        }

        draw() {
            if (this.sliced) {
                this.halves.forEach(h => {
                    ctx.save();
                    ctx.translate(h.x, h.y); ctx.rotate(h.rotation);
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, h.startAngle, h.endAngle);
                    ctx.closePath();
                    const grad = ctx.createLinearGradient(-this.radius, -this.radius, this.radius, this.radius);
                    grad.addColorStop(0, this.color1); grad.addColorStop(1, this.color2);
                    ctx.fillStyle = grad; ctx.fill();
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(h.startAngle)*this.radius, Math.sin(h.startAngle)*this.radius);
                    ctx.lineTo(Math.cos(h.endAngle)*this.radius, Math.sin(h.endAngle)*this.radius);
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
                    ctx.restore();
                });
                return;
            }

            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.save();
            ctx.rotate(this.rotation);
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            const grad = ctx.createRadialGradient(-this.radius/3, -this.radius/3, this.radius/5, 0, 0, this.radius);
            grad.addColorStop(0, this.color1); grad.addColorStop(1, this.color2);
            ctx.fillStyle = grad; ctx.fill();
            ctx.restore();

            ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
            ctx.beginPath(); 
            ctx.roundRect(-this.radius * 0.85, -15, this.radius * 1.7, 30, 10); 
            ctx.fill();

            ctx.fillStyle = 'white';
            ctx.font = `bold ${this.radius * 0.45}px Nunito`;
            ctx.textAlign = 'center'; 
            ctx.textBaseline = 'middle';
            ctx.fillText(this.word, 0, 0);
            ctx.restore();
        }

        slice() {
            this.sliced = true;
            this.toBeRemoved = true;
            
            swordSound.currentTime = 0;
            swordSound.play().catch(() => {});

            this.halves = [
                { x: this.x, y: this.y, vx: -2, vy: this.vy, vRot: -0.1, startAngle: 0, endAngle: Math.PI, rotation: this.rotation },
                { x: this.x, y: this.y, vx: 2, vy: this.vy, vRot: 0.1, startAngle: Math.PI, endAngle: Math.PI * 2, rotation: this.rotation }
            ];
            for(let i=0; i<10; i++) particles.push(new Particle(this.x, this.y, this.color1));
            
            if (this.isCorrect) {
                this.player.score += 10;
                this.player.streak++;
                
                if (this.player.streak >= 10) {
                    this.player.streak = 0;
                    pickNewTarget(this.player);
                    difficultyMultiplier += 0.2; 
                    createPopup("LEVEL UP!", this.x, this.y - 40, '#f59e0b');
                } else {
                    createPopup(`+10 (Combo ${this.player.streak})`, this.x, this.y, '#10b981');
                }
            } else {
                this.player.lives--;
                this.player.streak = 0; 
                createPopup("SALAH!", this.x, this.y, '#ef4444');
                checkGameOver();
            }
        }
    }

    class Bomb {
        constructor(playerObj) {
            this.player = playerObj;
            this.radius = window.innerWidth < 768 ? 35 : 45;
            this.x = this.player.xMin + this.radius + Math.random() * (this.player.xMax - this.player.xMin - this.radius*2);
            this.y = height + this.radius;
            
            const centerX = (this.player.xMin + this.player.xMax) / 2;
            this.vx = (centerX - this.x) * 0.01 + (Math.random() - 0.5) * 2;
            this.vy = -(height * 0.012) - Math.random() * (height * 0.002) * difficultyMultiplier;
            this.gravity = height * 0.00018;
            
            this.rotation = 0;
            this.vRot = (Math.random() - 0.5) * 0.06;
            this.sliced = false;
        }

        update() {
            this.x += this.vx; 
            this.y += this.vy;
            this.vy += this.gravity; 
            this.rotation += this.vRot;

            if (this.y > height + this.radius * 2 && this.vy > 0) {
                this.toBeRemoved = true;
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);

            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            const grad = ctx.createRadialGradient(-this.radius/3, -this.radius/3, this.radius/5, 0, 0, this.radius);
            grad.addColorStop(0, '#555'); 
            grad.addColorStop(1, '#111');
            ctx.fillStyle = grad; 
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(0, -this.radius);
            ctx.quadraticCurveTo(this.radius/2, -this.radius*1.5, this.radius/2, -this.radius*1.2);
            ctx.strokeStyle = '#888'; 
            ctx.lineWidth = 4; 
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(this.radius/2, -this.radius*1.2, 5 + Math.random()*4, 0, Math.PI*2);
            ctx.fillStyle = '#f59e0b'; 
            ctx.fill();

            ctx.restore();
        }

        slice() {
            this.sliced = true;
            this.toBeRemoved = true;
            
            swordSound.currentTime = 0;
            swordSound.play().catch(() => {});

            for(let i=0; i<15; i++) particles.push(new Particle(this.x, this.y, '#ef4444')); 
            for(let i=0; i<10; i++) particles.push(new Particle(this.x, this.y, '#f59e0b')); 
            for(let i=0; i<10; i++) particles.push(new Particle(this.x, this.y, '#111111')); 
            
            this.player.lives--;
            this.player.streak = 0; 
            createPopup("BOM!", this.x, this.y, '#ef4444');
            checkGameOver();
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x; this.y = y;
            this.vx = (Math.random() - 0.5) * 8;
            this.vy = (Math.random() - 0.5) * 8;
            this.life = 1.0; this.color = color;
            this.size = Math.random() * 6 + 2;
        }
        update() { this.x += this.vx; this.y += this.vy; this.vy += 0.15; this.life -= 0.02; }
        draw() {
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.color;
            ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    }

    // --- FUNGSI PENDUKUNG ---

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        width = canvas.width; height = canvas.height;
        p1.xMin = 0; p1.xMax = width;

        if (gameState === 'menu') {
            initMenu();
        } else if (gameState === 'playing' && gameMode === 'hard') {
            // Posisi box bergantung dimensi layar, reset level agar posisi sesuai
            initHardModeLevel(); 
        }
    }
    window.addEventListener('resize', resize);

    function pickNewTarget(playerObj) {
        const oldTarget = playerObj.targetWord;
        let newData;
        do {
            newData = RHYME_DATA[Math.floor(Math.random() * RHYME_DATA.length)];
        } while (newData.target === oldTarget);
        
        playerObj.currentData = newData;
        playerObj.targetWord = playerObj.currentData.target;
    }

    function backToMenu() {
        gameState = 'menu';
        canvas.style.backgroundImage = "url('https://github.com/user-attachments/assets/b7909539-0d15-4536-8a7a-286c487d5fee')";
        document.getElementById('gameOverScreen').classList.add('hidden');
        ctx.clearRect(0, 0, width, height);
        
        initMenu();
        swipes = {};
        particles = [];
        bombs = [];
        draggingItem = null;
        
        lastTime = performance.now();
        requestAnimationFrame(gameLoop); 
    }

    function checkGameOver() { if (p1.lives <= 0) gameOver(); }

    function gameOver() {
        gameState = 'gameover';
        document.getElementById('gameOverScreen').classList.remove('hidden');
        document.getElementById('gameOverScore').innerText = `Skor Akhir: ${p1.score}`;
        
        // Simpan skor tertinggi
        if (gameMode === 'single' && p1.score > highScoreEasy) {
            highScoreEasy = p1.score;
            localStorage.setItem('rajaPantunHighScoreEasy', highScoreEasy);
        } else if (gameMode === 'medium' && p1.score > highScoreMedium) {
            highScoreMedium = p1.score;
            localStorage.setItem('rajaPantunHighScoreMedium', highScoreMedium);
        } else if (gameMode === 'hard' && p1.score > highScoreHard) {
            highScoreHard = p1.score;
            localStorage.setItem('rajaPantunHighScoreHard', highScoreHard);
        }
    }

    function createPopup(text, x, y, color) {
        popups.push({ text, x, y, color, life: 1.0, vy: -2 });
    }

    // --- RENDER LOOP UTAMA ---

    function gameLoop(timestamp) {
        let dt = timestamp - lastTime;
        lastTime = timestamp;

        ctx.clearRect(0, 0, width, height);

        if (gameState === 'menu' || gameState === 'countdown') {
            menuButtons.forEach(btn => btn.draw());
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update(); particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }
            drawSwipes();
            if (gameState !== 'gameover') requestAnimationFrame(gameLoop);
            return;
        }

        if (gameState === 'gameover') return;

        // MODE BERMAIN (HARD: DRAG AND DROP)
        if (gameMode === 'hard') {
            drawHardMode(timestamp);
            requestAnimationFrame(gameLoop);
            return;
        }

        // MODE BERMAIN (EASY & MEDIUM: SLICING)
        spawnTimer += dt;
        if (spawnTimer > spawnInterval) {
            spawnTimer = 0;
            
            if (gameMode === 'medium') {
                if (Math.random() < 0.15) pickNewTarget(p1);
                
                let spawnCount = Math.floor(Math.random() * 2) + 2; 
                for (let i = 0; i < spawnCount; i++) {
                    if (Math.random() < 0.2) bombs.push(new Bomb(p1));
                    else fruits.push(new Fruit(p1));
                }
                if (spawnInterval > 1500) spawnInterval -= 15;

            } else { // single / mudah
                fruits.push(new Fruit(p1));
                if (spawnInterval > 1200) spawnInterval -= 10;
            }
        }

        drawHUD();

        for (let i = fruits.length - 1; i >= 0; i--) {
            fruits[i].update(); fruits[i].draw();
            if (fruits[i].toBeRemoved) fruits.splice(i, 1);
        }

        for (let i = bombs.length - 1; i >= 0; i--) {
            bombs[i].update(); bombs[i].draw();
            if (bombs[i].toBeRemoved) bombs.splice(i, 1);
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            particles[i].update(); particles[i].draw();
            if (particles[i].life <= 0) particles.splice(i, 1);
        }

        for (let i = popups.length - 1; i >= 0; i--) {
            let p = popups[i];
            p.y += p.vy; p.life -= 0.015;
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color; ctx.font = 'bold 30px Fredoka One';
            ctx.textAlign = 'center'; ctx.fillText(p.text, p.x, p.y);
            if (p.life <= 0) popups.splice(i, 1);
        }
        ctx.globalAlpha = 1.0;
        drawSwipes();
        
        requestAnimationFrame(gameLoop);
    }

    function drawHUD() {
        ctx.fillStyle = 'white'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
        let fontSizeTitle = width < 768 ? 20 : 30;
        let fontSizeWord = width < 768 ? 30 : 50;
        ctx.font = `bold ${fontSizeTitle}px Nunito`;
        ctx.fillText("Cari rima dari kata:", width/2, 20);
        ctx.font = `bold ${fontSizeWord}px Fredoka One`;
        ctx.fillStyle = '#fceabb';
        ctx.fillText(`"${p1.targetWord}"`, width/2, 20 + fontSizeTitle + 10);
        
        ctx.fillStyle = 'white'; ctx.font = `bold ${fontSizeTitle}px Nunito`;
        ctx.textAlign = 'left'; 
        ctx.fillText(`Skor: ${p1.score}`, 20, 20);
        
        ctx.fillStyle = '#f59e0b';
        ctx.fillText(`Combo: ${p1.streak}/10`, 20, 100);

        ctx.fillStyle = '#ef4444';
        for(let i=0; i<3; i++) ctx.fillText(i < p1.lives ? "❤️" : "🖤", 20 + (i * 35), 60);
    }

    // --- SISTEM SLICING & DRAG INPUT ---
    let isMouseDown = false;

    function getPointerPos(e) {
        if (e.touches && e.touches.length > 0) {
            return { x: e.touches[0].clientX, y: e.touches[0].clientY };
        } else if (e.changedTouches && e.changedTouches.length > 0) {
            return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
        }
        return { x: e.clientX, y: e.clientY };
    }

    function handlePointerDown(e) {
        let pos = getPointerPos(e);
        
        if (gameState === 'playing' && gameMode === 'hard') {
            // Cek apakah menyentuh blok kata untuk didrag (Cek dari yang teratas/terakhir)
            for (let i = draggables.length - 1; i >= 0; i--) {
                let d = draggables[i];
                if (pos.x > d.x - d.w/2 && pos.x < d.x + d.w/2 && pos.y > d.y - d.h/2 && pos.y < d.y + d.h/2) {
                    draggingItem = d;
                    d.isDragging = true;
                    dragOffsetX = pos.x - d.x;
                    dragOffsetY = pos.y - d.y;
                    
                    // Lepaskan dari slot jika sebelumnya berada di slot
                    let slot = slots.find(s => s.currentItem === d);
                    if (slot) slot.currentItem = null;
                    break;
                }
            }
        } else if (gameState === 'playing' || gameState === 'menu') {
            isMouseDown = true; 
            swipes['mouse'] = []; 
            addSwipePoint('mouse', pos.x, pos.y); 
        }
    }

    function handlePointerMove(e) {
        let pos = getPointerPos(e);
        
        if (gameState === 'playing' && gameMode === 'hard' && draggingItem) {
            draggingItem.x = pos.x - dragOffsetX;
            draggingItem.y = pos.y - dragOffsetY;
        } else if (isMouseDown) {
            addSwipePoint('mouse', pos.x, pos.y); 
        }
    }

    function handlePointerUp(e) {
        if (gameState === 'playing' && gameMode === 'hard' && draggingItem) {
            let snapped = false;
            // Cek apakah dilepaskan di area slot
            for (let s of slots) {
                if (Math.hypot(draggingItem.x - s.x, draggingItem.y - s.y) < s.h) {
                    // Tukar posisi jika slot sudah terisi
                    if (s.currentItem && s.currentItem !== draggingItem) {
                        s.currentItem.x = s.currentItem.originX;
                        s.currentItem.y = s.currentItem.originY;
                        s.currentItem = null;
                    }
                    s.currentItem = draggingItem;
                    draggingItem.x = s.x;
                    draggingItem.y = s.y;
                    snapped = true;
                    break;
                }
            }
            
            // Kembalikan ke posisi awal jika tidak mengenai slot
            if (!snapped) {
                draggingItem.x = draggingItem.originX;
                draggingItem.y = draggingItem.originY;
            }
            
            draggingItem.isDragging = false;
            draggingItem = null;
            
            checkHardModeWin();
        } else {
            isMouseDown = false; 
            delete swipes['mouse']; 
        }
    }

    // --- SWIPE LOGIC ---
    function addSwipePoint(id, x, y) {
        if (!swipes[id]) swipes[id] = [];
        swipes[id].push({ x, y });
        if (swipes[id].length > 8) swipes[id].shift();
        
        if (swipes[id].length >= 2) {
            let pt1 = swipes[id][swipes[id].length - 2];
            let pt2 = swipes[id][swipes[id].length - 1];
            checkSlice(pt1.x, pt1.y, pt2.x, pt2.y);
        }
    }

    function checkSlice(x1, y1, x2, y2) {
        if (gameState === 'menu') {
            for (let btn of menuButtons) {
                if (btn.sliced) continue;
                let dist = distToSegment({x: btn.x, y: btn.y}, {x: x1, y: y1}, {x: x2, y: y2});
                if (dist < Math.max(btn.w, btn.h) / 1.5) {
                    btn.slice();
                    break;
                }
            }
            return;
        }

        if (gameState === 'playing' && gameMode !== 'hard') {
            for (let f of fruits) {
                if (f.sliced) continue;
                let dist = distToSegment({x: f.x, y: f.y}, {x: x1, y: y1}, {x: x2, y: y2});
                if (dist < f.radius) f.slice();
            }

            for (let b of bombs) {
                if (b.sliced) continue;
                let dist = distToSegment({x: b.x, y: b.y}, {x: x1, y: y1}, {x: x2, y: y2});
                if (dist < b.radius) b.slice();
            }
        }
    }

    function distToSegment(p, v, w) {
        let l2 = Math.pow(w.x - v.x, 2) + Math.pow(w.y - v.y, 2);
        if (l2 == 0) return Math.hypot(p.x - v.x, p.y - v.y);
        let t = Math.max(0, Math.min(1, ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2));
        return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
    }

    function drawSwipes() {
        for (let id in swipes) {
            let points = swipes[id];
            if (points.length < 2) continue;
            ctx.beginPath(); ctx.moveTo(points[0].x, points[0].y);
            for (let i = 1; i < points.length; i++) ctx.lineTo(points[i].x, points[i].y);
            ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 8;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)'; ctx.stroke();
        }
    }

    // --- EVENTS ATTACHMENT ---
    canvas.addEventListener('mousedown', handlePointerDown);
    canvas.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('mouseup', handlePointerUp);
    
    canvas.addEventListener('touchstart', (e) => {
        if(gameState !== 'playing' && gameState !== 'menu') return; 
        e.preventDefault();
        handlePointerDown(e);
    }, {passive: false});
    
    canvas.addEventListener('touchmove', (e) => {
        if(gameState !== 'playing' && gameState !== 'menu') return; 
        e.preventDefault();
        handlePointerMove(e);
    }, {passive: false});
    
    canvas.addEventListener('touchend', (e) => {
        handlePointerUp(e);
        for (let t of e.changedTouches) delete swipes[t.identifier];
    });
    canvas.addEventListener('touchcancel', (e) => {
        handlePointerUp(e);
        for (let t of e.changedTouches) delete swipes[t.identifier];
    });

    // --- MULAI PERTAMA KALI ---
    resize();
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);

</script>
